<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 60" width="100%" height="100%">
  <defs>
    <linearGradient id="ruiBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#64748B" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <radialGradient id="ruiFin" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </radialGradient>
    <filter id="shadowRui" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="55" cy="52" rx="42" ry="4" fill="#94a3b8" opacity="0.3" />
  <g filter="url(#shadowRui)">
    <!-- Tail Fin -->
    <path d="M 86,30 L 104,18 C 100,28 100,32 104,42 Z" fill="url(#ruiFin)" opacity="0.9" />
    <!-- Dorsal Fin -->
    <path d="M 44,18 C 50,12 60,14 66,20 Z" fill="url(#ruiFin)" opacity="0.9" />
    <!-- Ventral / Anal Fins -->
    <path d="M 62,38 L 70,44 L 72,40 Z" fill="url(#ruiFin)" opacity="0.9" />
    <path d="M 40,36 L 46,42 L 48,37 Z" fill="url(#ruiFin)" opacity="0.9" />
    <!-- Torpedo Body -->
    <path d="M 12,30 C 18,18 42,16 68,20 C 82,22 88,28 88,30 C 88,32 82,38 68,40 C 42,44 18,42 12,30 Z" fill="url(#ruiBody)" />
    <!-- Pectoral Fin -->
    <path d="M 28,32 C 34,34 38,36 38,38 C 34,38 30,36 26,34 Z" fill="url(#ruiFin)" opacity="0.95" />
    <!-- Gill cover arc -->
    <path d="M 26,23 C 30,26 30,34 26,37" stroke="#475569" stroke-width="1.2" fill="none" />
    <!-- Eye -->
    <circle cx="20" cy="27" r="2.5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5" />
    <circle cx="20" cy="27" r="1.5" fill="#0F172A" />
    <circle cx="20.5" cy="26.5" r="0.5" fill="#FFFFFF" />
    <!-- Scales hint -->
    <path d="M 42,24 C 44,26 44,28 42,30" stroke="#94A3B8" stroke-width="0.8" fill="none" opacity="0.6" />
    <path d="M 48,25 C 50,27 50,29 48,31" stroke="#94A3B8" stroke-width="0.8" fill="none" opacity="0.6" />
    <path d="M 54,24 C 56,26 56,28 54,30" stroke="#94A3B8" stroke-width="0.8" fill="none" opacity="0.6" />
    <path d="M 60,25 C 62,27 62,29 60,31" stroke="#94A3B8" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
</svg>

