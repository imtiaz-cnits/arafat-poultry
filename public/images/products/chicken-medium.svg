<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyBrown" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#DE893C" />
      <stop offset="60%" stop-color="#B2551A" />
      <stop offset="100%" stop-color="#732B07" />
    </radialGradient>
    <filter id="shadowCh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="50" cy="80" rx="26" ry="6" fill="#94a3b8" opacity="0.3" />
  <g filter="url(#shadowCh)">
    <!-- Tail feathers -->
    <path d="M 28,45 C 18,32 14,18 24,24 C 18,22 15,36 28,48 Z" fill="#692403" />
    <path d="M 32,44 C 20,26 22,14 30,20 C 26,20 25,32 34,46 Z" fill="#8C350A" />
