    <path d="M 38,50 C 44,44 54,46 58,54 C 60,62 50,68 42,66 C 36,64 34,56 38,50 Z" fill="#8C350A" />
    <!-- Neck & Head -->
    <path d="M 54,36 C 58,26 64,18 70,18 C 74,18 78,22 76,28 C 72,36 66,42 60,46 Z" fill="url(#bodyBrown)" />
    <!-- Comb (Red) -->
    <path d="M 68,16 C 68,11 72,11 73,14 C 75,10 78,11 78,14 C 80,12 83,14 81,18 C 77,20 72,20 68,16 Z" fill="#DC2626" />
