    <polygon points="78,22 86,24 78,27" fill="#FBBF24" />
    <!-- Eye -->
    <circle cx="73" cy="22" r="1.8" fill="#1E293B" />
    <circle cx="73.5" cy="21.5" r="0.6" fill="#FFFFFF" />
    <!-- Legs -->
    <line x1="46" y1="72" x2="44" y2="82" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="44" y1="82" x2="39" y2="83" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <line x1="44" y1="82" x2="47" y2="83" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <line x1="56" y1="72" x2="56" y2="82" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="56" y1="82" x2="52" y2="83" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <line x1="56" y1="82" x2="59" y2="83" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
